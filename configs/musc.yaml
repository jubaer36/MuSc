datasets:
  dataset_name: 'mvtec_ad'  # choice ['mvtec_ad', 'mvtec_ad2', 'visa', 'btad']
  data_path: ./data/mvtec_anomaly_detection/
  class_name: 'ALL'
  img_resize: 518
  divide_num: 1
models:
  backbone_name: 'ViT-L-14-336'   # or 'facebook/dinov3-vitl16-pretrain-lvd1689m'
  pretrained: 'openai'             # unused for DINOv3
  batch_size: 4
  feature_layers: [5, 11, 17, 23]
  r_list: [1, 3, 5]
device: 0
testing:
  output_dir: 'output'
  vis: False
  vis_type: single_norm  # choice ['single_norm', 'whole_norm']
  save_excel: False
sam:
  enabled: False
  checkpoint: './models/sam_vit_h.pth'
  model_type: 'vit_h'          # vit_h | vit_l | vit_b
  threshold_percentile: 95     # heatmap percentile for anomaly region detection
  blend_alpha: 0.3             # weight on SAM mask vs MuSc normalised score
  n_neg: 5                     # negative point prompts sampled per region
